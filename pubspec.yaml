name: layrz_nfc
description: "A Flutter library for cross-platform Near Field Communication (NFC), supporting Android, iOS, macOS and Windows."
version: 1.0.0
homepage: https://github.com/goldenm-software/layrz_nfc

keywords:
  - flutter
  - nfc
  - near field communication
  - cross-platform
  - android
  - ios
  - macos
  - windows
  - layrz

platforms:
  android:
  ios:
  macos:
  windows:

environment:
  sdk: ">3.6.0 <4.0.0"
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ndef: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  pigeon: ^25.3.1

flutter:
  plugin:
    platforms:
      android:
        package: com.layrz.layrz_nfc
        pluginClass: LayrzNfcPlugin
      windows:
        pluginClass: LayrzNfcPluginCApi