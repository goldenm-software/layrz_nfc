name: layrz_nfc_example
description: "Demonstrates how to use the layrz_nfc plugin."
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  layrz_icons: any
  layrz_theme: any
  layrz_models: any

  layrz_nfc:
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
